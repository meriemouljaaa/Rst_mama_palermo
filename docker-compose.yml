name: Mamma-Palermo
version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: mp-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: palermo_db
    ports:
      - "5003:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:7-alpine
    container_name: mp-redis
    ports:
      - "5004:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./apps/backend
    image: mp-backend
    container_name: mp-backend
    command: npm run dev
    ports:
      - "5000:3001"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: palermo_db
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379
      PORT: 3001
    depends_on:
      - db
      - redis
    volumes:
      - ./apps/backend:/app
      - /app/node_modules
      - ./apps/backend/uploads:/app/uploads

  frontend:
    build:
      context: ./apps/frontend
      target: build
    image: mp-frontend
    container_name: mp-frontend
    command: npm run dev -- --host
    ports:
      - "5001:5173"
    # VITE_API_URL removed to allow dynamic detection via window.location.hostname
    links:
      - backend:backend
    volumes:
      - ./apps/frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  admin:
    build:
      context: ./apps/admin
      target: build
    image: mp-admin
    container_name: mp-admin
    command: npm run dev -- --host --port 5174
    ports:
      - "5002:5174"
    # VITE_API_URL removed to allow dynamic detection via window.location.hostname
    links:
      - backend:backend
    volumes:
      - ./apps/admin:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
    external: true
    name: mp_postgres_data
  redis_data:
    external: true
    name: mp_redis_data
  backend_uploads:
    external: true
    name: mp_backend_uploads
